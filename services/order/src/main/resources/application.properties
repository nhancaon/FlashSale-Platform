spring.application.name=order
server.port=${PORT:8085}
server.tomcat.accept-count=1024
spring.threads.virtual.enabled=true

# Oracle (shared source of truth). DB_PASSWORD has no default: secrets come from the environment.
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
spring.jdbc.template.query-timeout=${DB_QUERY_TIMEOUT_S:5}s

# Inventory service (inventory-go or inventory-java, same contract).
order.inventory.url=${INVENTORY_URL:http://localhost:8083}
order.inventory.connect-timeout-ms=${INVENTORY_CONNECT_TIMEOUT_MS:500}
order.inventory.read-timeout-ms=${INVENTORY_READ_TIMEOUT_MS:2000}
order.inventory.retry-max-attempts=${INVENTORY_RETRY_MAX_ATTEMPTS:3}
order.inventory.retry-wait-ms=${INVENTORY_RETRY_WAIT_MS:50}
order.inventory.breaker-window=${INVENTORY_BREAKER_WINDOW:20}
order.inventory.breaker-failure-rate=${INVENTORY_BREAKER_FAILURE_RATE:50}
order.inventory.breaker-open-ms=${INVENTORY_BREAKER_OPEN_MS:10000}
order.inventory.bulkhead-max-concurrent=${INVENTORY_BULKHEAD_MAX:50}
order.inventory.bulkhead-max-wait-ms=${INVENTORY_BULKHEAD_WAIT_MS:200}

# Simulated payment (saga step between reserve and confirm).
order.payment.latency-ms=${PAYMENT_LATENCY_MS:20}
order.payment.fail-rate=${PAYMENT_FAIL_RATE:0}

# A PENDING order older than this is treated as abandoned: a client retry with the same Idempotency-Key resumes it.
order.stale-after-ms=${ORDER_STALE_AFTER_MS:30000}

spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
logging.structured.format.console=logstash
