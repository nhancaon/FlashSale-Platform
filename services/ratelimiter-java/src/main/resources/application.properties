spring.application.name=ratelimiter-java
server.port=${PORT:8082}

# Virtual threads: blocking Redis calls do not tie up platform threads.
spring.threads.virtual.enabled=true

ratelimit.algorithm=${RATELIMIT_ALGORITHM:token_bucket}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.connect-timeout=1s
# Upper bound for one limiter decision (Go: CHECK_TIMEOUT_MS).
spring.data.redis.timeout=${CHECK_TIMEOUT_MS:200}ms

# Same contract as the Go service: unknown JSON fields are rejected.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Metrics at /metrics, same path as the Go service.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics

# One JSON object per log line, with request_id from MDC.
logging.structured.format.console=logstash

# Flash-sale traffic opens many connections at once; a bigger accept queue (Tomcat default: 100)
# avoids refused connections during a burst.
server.tomcat.accept-count=1024
