spring.application.name=inventory-java
server.port=${PORT:8084}
server.tomcat.accept-count=1024

# Virtual threads: requests blocked on a row lock or the pool do not tie up platform threads.
spring.threads.virtual.enabled=true

# Oracle. DB_PASSWORD has no default on purpose: secrets come from the environment.
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:flashsale}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
spring.jdbc.template.query-timeout=${DB_QUERY_TIMEOUT_S:5}s

# Stock strategy: atomic | pessimistic | optimistic
inventory.stock-strategy=${STOCK_STRATEGY:atomic}
inventory.optimistic-max-retries=${OPTIMISTIC_MAX_RETRIES:50}

# Cache-aside for GET /v1/inventory/{sku}. Redis is best effort: failures fall back to Oracle.
inventory.cache.enabled=${CACHE_ENABLED:true}
inventory.cache.ttl-ms=${CACHE_TTL_MS:2000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=100ms

spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
logging.structured.format.console=logstash
