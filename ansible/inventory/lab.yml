---
# The lab of deploy/lab (containers acting as VMs). A real environment gets its own inventory file with the same groups.
all:
  vars:
    # Plays connect as the deploy user that the common role creates. The first play of site.yml connects as the
    # bootstrap account of a fresh server (bootstrap_user) to create it.
    ansible_user: deploy
    ansible_ssh_private_key_file: /root/.ssh-lab-rw/id_ed25519
  children:
    data:
      hosts:
        lab-data: { ansible_host: 172.30.0.10 }
    k3s_server:
      hosts:
        lab-k3s-server: { ansible_host: 172.30.0.11 }
    k3s_agent:
      hosts:
        lab-k3s-agent: { ansible_host: 172.30.0.12 }
    k3s:
      children:
        k3s_server:
        k3s_agent:
