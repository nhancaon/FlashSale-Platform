---
# 1. Images: saved on the controller by `make lab-images` (deploy/lab/images/<service>-<version>.tar) and imported into
#    containerd on every k3s node, so pods start without a registry (imagePullPolicy: Never).
- name: Image directory
  ansible.builtin.file:
    path: /var/lib/flashsale-images
    state: directory
    mode: "0755"

- name: Copy image archives
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/lab/images/{{ item }}-{{ app_version }}.tar"
    dest: /var/lib/flashsale-images/{{ item }}-{{ app_version }}.tar
    mode: "0644"
  loop: "{{ app_deploy_images }}"
  register: app_deploy_image_copy

- name: Import images into containerd
  ansible.builtin.command: k3s ctr --namespace k8s.io images import /var/lib/flashsale-images/{{ item.item }}-{{ app_version }}.tar
  loop: "{{ app_deploy_image_copy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.changed # noqa: no-handler
  changed_when: true

# 2. Manifests, rendered from deploy/k8s and applied on the server.
- name: Manifests
  when: inventory_hostname in groups['k3s_server']
  block:
    - name: Manifest directory
      ansible.builtin.file:
        path: "{{ app_dir }}/k8s"
        state: directory
        mode: "0750"

    - name: Render manifests
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../deploy/k8s/{{ item }}.j2"
        dest: "{{ app_dir }}/k8s/{{ item }}"
        mode: "0640"
      loop: [00-namespace.yaml, 10-external.yaml, 20-config.yaml, 30-apps.yaml, 40-hpa.yaml]

    - name: Namespace
      ansible.builtin.command: k3s kubectl apply -f {{ app_dir }}/k8s/00-namespace.yaml
      register: app_deploy_ns
      changed_when: "'unchanged' not in app_deploy_ns.stdout"

    # The Secret is built from vault variables and piped to kubectl: it never lands in a file on the node.
    - name: Secret from the vault
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl -n {{ app_namespace }} create secret generic flashsale-secrets \
          --from-literal=DB_PASSWORD="$DB_PASSWORD" --from-literal=JWT_SECRET="$JWT_SECRET" \
          --from-literal=DEMO_PASSWORD="$DEMO_PASSWORD" --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        DB_PASSWORD: "{{ app_db_password }}"
        JWT_SECRET: "{{ jwt_secret }}"
        DEMO_PASSWORD: "{{ demo_password }}"
      register: app_deploy_secret
      changed_when: "'unchanged' not in app_deploy_secret.stdout"
      no_log: true

    # `kubectl apply` reports PodDisruptionBudgets as "configured" on every run, so changes are detected with
    # `kubectl diff` (exit 1 = differences, 0 = none, >1 = error) and applied only when there are some.
    - name: Differences with the cluster
      ansible.builtin.command: k3s kubectl diff -f {{ app_dir }}/k8s/
      register: app_deploy_diff
      changed_when: app_deploy_diff.rc == 1
      failed_when: app_deploy_diff.rc > 1
      check_mode: false

    - name: Apply
      ansible.builtin.command: k3s kubectl apply -f {{ app_dir }}/k8s/
      when: app_deploy_diff.rc == 1
      changed_when: true

    # A new app_version changes the image of every Deployment: Kubernetes rolls the pods one by one
    # (maxUnavailable 0, readiness probe on /readyz), so the service keeps answering during the deploy.
    - name: Wait for every rollout
      ansible.builtin.command: k3s kubectl -n {{ app_namespace }} rollout status deployment/{{ item }} --timeout=300s
      loop: "{{ app_deploy_deployments }}"
      changed_when: false
      check_mode: false

    - name: Gateway answers through its NodePort
      ansible.builtin.uri:
        url: http://{{ ansible_host }}:{{ gateway_node_port }}/readyz
      register: app_deploy_gateway
      until: app_deploy_gateway.status == 200
      retries: 20
      delay: 3
      check_mode: false
