---
app_deploy_images: [gateway, order, "inventory-{{ inventory_impl }}", outbox-worker, notification]
app_deploy_deployments: [inventory, order, outbox-worker, notification, gateway]
app_deploy_replicas:
  gateway: 2
  inventory: 2
  order: 2
  outbox_worker: 2
  notification: 2 # two consumers of one group: a drain never stops notifications
app_deploy_hpa: # name: replicas between min and max, target CPU utilisation (% of the request)
  gateway: { min: 2, max: 4, cpu: 60 }
  inventory: { min: 2, max: 4, cpu: 60 }
