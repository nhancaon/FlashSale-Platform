name: ci-java

on:
  push:
    branches: [main]
    paths: ["services/*-java/**", "services/order/**", "services/checkstyle.xml", "db/**", ".github/workflows/ci-java.yml"]
  pull_request:
    paths: ["services/*-java/**", "services/order/**", "services/checkstyle.xml", "db/**", ".github/workflows/ci-java.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ratelimiter-java, inventory-java, order]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      # Build, tests (Testcontainers starts Oracle Free / Redis when no local stack is configured), Checkstyle, JaCoCo.
      - name: mvn verify
        run: ./mvnw -B -ntp verify
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "| ${{ matrix.service }} | %.1f%% lines |\n", c*100/(m+c)}' "$csv" > /tmp/cov.md
            { echo "| Service | Coverage |"; echo "|---|---:|"; cat /tmp/cov.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-reports
          path: |
            services/${{ matrix.service }}/target/site/jacoco/
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/checkstyle-result.xml
          if-no-files-found: ignore
