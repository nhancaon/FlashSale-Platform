name: ci-go

on:
  push:
    branches: [main]
    paths: ["services/**", "!services/*-java/**", "!services/order/**", "db/**", "deploy/compose/docker-compose.yml", "Makefile", ".env.example", ".github/workflows/ci-go.yml"]
  pull_request:
    paths: ["services/**", "!services/*-java/**", "!services/order/**", "db/**", "deploy/compose/docker-compose.yml", "Makefile", ".env.example", ".github/workflows/ci-go.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ratelimiter-go, inventory-go, outbox-worker, notification, gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.module }}/go.sum
      - name: golangci-lint (config in services/.golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          working-directory: services/${{ matrix.module }}

  test:
    # Integration tests run against the real stack of `make up` (Oracle Free, Redis, Kafka), as on a dev machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/*/go.sum
      - name: Lua scripts identical in Go and Java
        run: make check-lua
      - name: Start infrastructure (Oracle, Redis, Kafka)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/compose/docker-compose.yml up -d --wait oracle redis kafka
      - name: Migrate
        run: make db-migrate
      - name: go vet + go test -race with coverage
        run: |
          set -a; . ./.env; set +a
          export DB_PASSWORD=$APP_USER_PASSWORD KAFKA_BROKERS=localhost:29092 TEST_REDIS_ADDR=localhost:${REDIS_HOST_PORT:-6380}
          echo "| Module | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          for s in ratelimiter-go inventory-go outbox-worker notification gateway; do
            echo "::group::$s"
            (cd services/$s && go vet ./... && go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...)
            total=$(cd services/$s && go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
            echo "| $s | $total |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/*/coverage.out
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/docker-compose.yml logs --tail=200
