name: docker

# Builds every service image (multi-stage, non-root), scans it with Trivy, pushes it to GHCR from main,
# and writes an image size table (Go vs Java) to the run summary.
on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/docker.yml", ".trivyignore"]
  pull_request:
    paths: ["services/**", ".github/workflows/docker.yml", ".trivyignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ratelimiter-go, lang: go, context: services/ratelimiter-go, file: services/ratelimiter-go/Dockerfile }
          - { service: ratelimiter-java, lang: java, context: services/ratelimiter-java, file: services/ratelimiter-java/Dockerfile }
          - { service: inventory-go, lang: go, context: services/inventory-go, file: services/inventory-go/Dockerfile }
          - { service: inventory-java, lang: java, context: services/inventory-java, file: services/inventory-java/Dockerfile }
          - { service: order, lang: java, context: services/order, file: services/order/Dockerfile }
          - { service: outbox-worker, lang: go, context: services/outbox-worker, file: services/outbox-worker/Dockerfile }
          - { service: notification, lang: go, context: services/notification, file: services/notification/Dockerfile }
          # the gateway imports the limiter library of ratelimiter-go, so its context is services/
          - { service: gateway, lang: go, context: services, file: services/gateway/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/flashsale-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Runs as non-root
        run: |
          user=$(docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Config.User}}')
          echo "image user: '$user'"
          [ -n "$user" ] && [ "$user" != root ] && [ "$user" != 0 ] && [ "$user" != "0:0" ]
      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - name: Record image size
        run: |
          mkdir -p sizes
          bytes=$(docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Size}}')
          echo "${{ matrix.service }},${{ matrix.lang }},$bytes" > sizes/${{ matrix.service }}.csv
      - uses: actions/upload-artifact@v7
        with:
          name: size-${{ matrix.service }}
          path: sizes/
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  sizes:
    needs: image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: size-*
          merge-multiple: true
          path: sizes
      - name: Image size table
        run: |
          {
            echo "### Image sizes (uncompressed)"
            echo "| Service | Language | Size (MiB) |"
            echo "|---|---|---:|"
            cat sizes/*.csv | sort -t, -k2,2 -k1,1 | awk -F, '{printf "| %s | %s | %.1f |\n", $1, $2, $3/1048576}'
            echo
            awk -F, '{s[$2]+=$3; n[$2]++} END {printf "Average: Go %.1f MiB, Java %.1f MiB\n", s["go"]/n["go"]/1048576, s["java"]/n["java"]/1048576}' sizes/*.csv
          } >> "$GITHUB_STEP_SUMMARY"
