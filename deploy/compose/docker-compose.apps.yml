# Application services. Use together with docker-compose.yml (infrastructure):
#   make up-apps INVENTORY_IMPL=go|java
# Every service listens on 8080 inside its container; host ports are 8081..8085.
# CPU / memory limits come from APP_CPUS / APP_MEM so benchmarks can compare Go and Java fairly.

x-limits: &limits
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEM:-1g}

x-db-env: &db-env
  DB_HOST: oracle
  DB_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
  DB_USER: ${APP_USER}
  DB_PASSWORD: ${APP_USER_PASSWORD}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz > /dev/null || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 5s

services:
  ratelimiter-go:
    profiles: [ratelimiter-go]
    build: ../../services/ratelimiter-go
    image: flashsale/ratelimiter-go
    <<: *limits
    environment:
      RATELIMIT_ALGORITHM: ${RATELIMIT_ALGORITHM:-token_bucket}
      REDIS_ADDR: redis:6379
    ports: ["8081:8080"]
    healthcheck: *healthcheck
    depends_on:
      redis: { condition: service_healthy }

  ratelimiter-java:
    profiles: [ratelimiter-java]
    build: ../../services/ratelimiter-java
    image: flashsale/ratelimiter-java
    <<: *limits
    environment:
      RATELIMIT_ALGORITHM: ${RATELIMIT_ALGORITHM:-token_bucket}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports: ["8082:8080"]
    healthcheck: *healthcheck
    depends_on:
      redis: { condition: service_healthy }

  inventory-go:
    profiles: [inventory-go]
    build: ../../services/inventory-go
    image: flashsale/inventory-go
    <<: *limits
    environment:
      <<: *db-env
      REDIS_ADDR: redis:6379
      STOCK_STRATEGY: ${STOCK_STRATEGY:-atomic}
    ports: ["8083:8080"]
    healthcheck: *healthcheck
    depends_on:
      oracle: { condition: service_healthy }
      redis: { condition: service_healthy }

  inventory-java:
    profiles: [inventory-java]
    build: ../../services/inventory-java
    image: flashsale/inventory-java
    <<: *limits
    environment:
      <<: *db-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STOCK_STRATEGY: ${STOCK_STRATEGY:-atomic}
      DB_POOL_TIMEOUT_MS: "30000"
    ports: ["8084:8080"]
    healthcheck: *healthcheck
    depends_on:
      oracle: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Competing consumers of the outbox table: scale with `--scale outbox-worker=3` (see make up-apps OUTBOX_REPLICAS).
  outbox-worker:
    build: ../../services/outbox-worker
    image: flashsale/outbox-worker
    <<: *limits
    environment:
      <<: *db-env
      KAFKA_BROKERS: kafka:9092
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-2}
    healthcheck: *healthcheck
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification:
    build: ../../services/notification
    image: flashsale/notification
    <<: *limits
    environment:
      <<: *db-env
      KAFKA_BROKERS: kafka:9092
    ports: ["8087:8080"]
    healthcheck: *healthcheck
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # Public entry point: login, JWT, rate limit, circuit breaker, proxy to order / inventory.
  gateway:
    build:
      context: ../../services # the gateway imports the limiter library of ratelimiter-go
      dockerfile: gateway/Dockerfile
    image: flashsale/gateway
    <<: *limits
    environment:
      JWT_SECRET: "${JWT_SECRET:?run make env-sync to add JWT_SECRET to .env}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:?run make env-sync to add DEMO_PASSWORD to .env}"
      ORDER_URL: http://order:8080
      INVENTORY_URL: http://inventory-${INVENTORY_IMPL:-go}:8080
      RATELIMIT_MODE: ${RATELIMIT_MODE:-embedded}
      RATELIMIT_ALGORITHM: ${RATELIMIT_ALGORITHM:-token_bucket}
      RATELIMITER_URL: http://ratelimiter-go:8080
      REDIS_ADDR: redis:6379
      RL_USER_LIMIT: ${RL_USER_LIMIT:-20}
      RL_IP_LIMIT: ${RL_IP_LIMIT:-100}
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 3s
    depends_on:
      redis: { condition: service_healthy }

  order:
    build: ../../services/order
    image: flashsale/order
    <<: *limits
    environment:
      <<: *db-env
      INVENTORY_URL: http://inventory-${INVENTORY_IMPL:-go}:8080
      PAYMENT_FAIL_RATE: ${PAYMENT_FAIL_RATE:-0}
    ports: ["8085:8080"]
    healthcheck: *healthcheck
    depends_on:
      oracle: { condition: service_healthy }
